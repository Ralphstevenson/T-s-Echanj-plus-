<!-- BOUTON KI NAN SEKSYON PARAMÈT LA -->
<div class="settings-option">
  <button id="open-pin-modal-btn" class="btn-param-pin">
    <i class="fa-solid fa-key"></i> PIN Tranzaksyon
  </button>
</div>

<!-- FENÈT MODAL LA (KI AP LOUVRI LÈ W KLIKE SOU BOUTON AN) -->
<div id="pin-modal-overlay" class="pin-modal-overlay">
  <div class="pin-modal-card">
    <button class="close-modal-btn" id="close-pin-modal">&times;</button>
    
    <h3><i class="fa-solid fa-shield-halved"></i> Gestion PIN</h3>
    <p class="modal-desc">Chwazi sa ou vle fè ak PIN tranzaksyon ou an:</p>

    <!-- ME 2 BOUTON YO -->
    <div class="pin-actions">
      <button id="btn-show-create" class="action-btn create-btn">
        <i class="fa-solid fa-plus-circle"></i> Kreye PIN
      </button>
      <button id="btn-show-change" class="action-btn change-btn">
        <i class="fa-solid fa-arrows-rotate"></i> Chanje PIN
      </button>
    </div>

    <!-- FORMULAIRE KREYE PIN (KACHE PA DEFOT) -->
    <form id="create-pin-form" class="pin-form hidden">
      <h4>Kreye yon nouvo PIN</h4>
      <div class="form-group">
        <input type="password" id="create-pin-input" maxlength="4" pattern="[0-9]{4}" placeholder="Antre 4 chif" inputmode="numeric" required>
      </div>
      <div class="form-group">
        <input type="password" id="confirm-create-pin-input" maxlength="4" pattern="[0-9]{4}" placeholder="Konfime 4 chif yo" inputmode="numeric" required>
      </div>
      <button type="submit" class="btn-submit">Sove PIN mwen</button>
      <button type="button" class="btn-back">Retounen</button>
    </form>

    <!-- FORMULAIRE CHANJE PIN (KACHE PA DEFOT) -->
    <form id="change-pin-form" class="pin-form hidden">
      <h4>Chanje PIN ou</h4>
      <div class="form-group">
        <input type="password" id="old-pin-input" maxlength="4" pattern="[0-9]{4}" placeholder="Ansyen PIN" inputmode="numeric" required>
      </div>
      <div class="form-group">
        <input type="password" id="new-pin-input" maxlength="4" pattern="[0-9]{4}" placeholder="Nouvo PIN" inputmode="numeric" required>
      </div>
      <button type="submit" class="btn-submit">Mete ajou PIN la</button>
      <button type="button" class="btn-back">Retounen</button>
    </form>

    <div id="modal-pin-status" class="status-msg"></div>
  </div>
</div>
